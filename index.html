<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Chess Master - Mobile MVC</title><link rel="stylesheet" href="style.css"></head><body><div id="start-menu-modal"><div class="welcome-bg-glow"></div><button id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Ganti Tema"><span id="theme-icon">&#9789;</span></button><div class="start-menu-content"><div class="chess-brand"><div class="brand-icon">&#9816;</div><h1>CHESS MASTER</h1><p>Pilih mode tantangan permainanmu</p></div><div class="menu-options"><button class="menu-btn pvp-btn" onclick="togglePvPOptions()"><span class="btn-icon">&#128101;</span><div class="btn-text"><span class="btn-title">By One</span><span class="btn-subtitle">Main sama teman</span></div><span id="pvp-arrow" class="btn-arrow">&rsaquo;</span></button><div class="menu-divider"><span>ATAU LAWAN KOMPUTER</span></div><div id="pvp-sub-options"><button class="ai-btn normal" onclick="startGame('pvp', 'normal')"><span class="ai-level">Santai</span><span class="ai-desc">Tanpa Timer</span></button><button class="ai-btn hard" onclick="startGame('pvp', 'timer')"><span class="ai-level">Kompetitiv</span><span class="ai-desc">Dengan timer</span></button></div><div class="ai-mode-grid"><button class="ai-btn easy" onclick="startGame('ai', 'mudah')"><span class="ai-level">Mudah</span><span class="ai-desc">Pemula</span></button><button class="ai-btn normal" onclick="startGame('ai', 'normal')"><span class="ai-level">Normal</span><span class="ai-desc">Standar</span></button><button class="ai-btn hard" onclick="startGame('ai', 'sulit')"><span class="ai-level">Sulit</span><span class="ai-desc">Master</span></button></div></div></div></div><div id="app-container" class="hidden"><div class="player-panel black-panel"><div class="player-info-mini"><span class="indicator black-dot"></span><span class="player-name">Hitam</span></div><div class="timer" id="black-timer">10:00</div></div><div id="black-eats" class="captured-pieces"></div><div class="board-center-wrapper"><div id="board-wrapper"><div id="chessboard"></div><div id="promotion-modal" class="hidden"><div class="promotion-content"><h3>Pilih Promosi Bidak</h3><div id="promo-options"></div></div></div></div><button id="exit-game-btn" onclick="openExitModal()" aria-label="Keluar"><span>&times;</span></button></div><div id="white-eats" class="captured-pieces"></div><div class="player-panel white-panel"><div class="player-info-mini"><span class="indicator white-dot"></span><span class="player-name">Putih</span></div><div class="timer" id="white-timer"></div></div></div><div id="game-over-modal" class="hidden"><div class="game-over-card"><div class="game-over-icon">&#127942;</div><h2 id="game-over-title">Skakmat!</h2><p id="game-over-message">Putih Menang</p><button id="restart-btn">Main Lagi</button></div></div><div id="exit-modal" class="hidden"><div class="exit-card"><div class="exit-icon">&#9888;</div><h3>Keluar ke Menu Utama?</h3><p>lemah banget masa mau keluar poke</p><div class="exit-actions"><button id="cancel-exit-btn" onclick="closeExitModal()">Batal</button><button id="confirm-exit-btn" onclick="confirmExit()">Keluar</button></div></div></div><script src="script.js"></script></body></html>
